name: LinkedIn Job Alert

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Watch LinkedIn jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEYWORDS: "Business Development Manager, Proposal Manager, Bid Manager, Commercial Manager, Facility Manager"
          LOCATIONS: "Saudi Arabia"
          TITLE_INCLUDE: "business development,bd manager,proposal manager,bid manager,commercial manager,facility manager,partnership"
          EXCLUDE: "intern,internship,student,graduate"
          EASY_APPLY: "true"
          TIME_WINDOW: "r3600"
        run: |
          git config user.name "job-alert-bot"
          git config user.email "bot@users.noreply.github.com"
          END=$(( $(date +%s) + 20700 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            python linkedin_alert.py || true
            if ! git diff --quiet -- seen.json; then
              git add seen.json
              git commit -m "update seen jobs [skip ci]"
              git pull --rebase --autostash || true
              git push || true
            fi
            sleep 150
          done
